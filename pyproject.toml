[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logsman"
version = "0.1.0"
description = "A small Sillo service that archives BEACN log events in MongoDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sillo-framework==1.0.1",
    "pymongo>=4.11,<5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"routes/*.py" = ["B008"]
